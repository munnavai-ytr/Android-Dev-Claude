<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1016" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.2" />
    </linearGradient>
    <filter id="forgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Subtle ambient glow circle -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" opacity="0.25" filter="url(#forgeGlow)" />

  <!-- Droid Forge Anvil / Android Head Symbol -->
  <g transform="translate(106, 96)">
    <!-- Android Antennas -->
    <line x1="80" y1="40" x2="52" y2="12" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />
    <line x1="220" y1="40" x2="248" y2="12" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Android Head Arch -->
    <path d="M 30,120 A 120,120 0 0,1 270,120 Z" fill="url(#accentGrad)" />

    <!-- Android Eyes (Forged Lenses) -->
    <circle cx="95" cy="88" r="12" fill="#07080B" />
    <circle cx="205" cy="88" r="12" fill="#07080B" />

    <!-- Forge Anvil & Hammer Base -->
    <rect x="20" y="140" width="260" height="20" rx="10" fill="#141722" stroke="url(#accentGrad)" stroke-width="4" />
    <path d="M 40,170 L 260,170 L 220,250 L 80,250 Z" fill="#141722" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
    
    <!-- Anvil Center Spark Flame -->
    <polygon points="150,185 165,225 150,218 135,225" fill="#3DDC84" filter="url(#forgeGlow)" />

    <!-- Tech Lines & Grid Elements -->
    <circle cx="150" cy="235" r="4" fill="#22D3EE" />
  </g>
</svg>
